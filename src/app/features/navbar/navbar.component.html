<nav class="navbar" [class.scrolled]="isScrolled()" [class.mobile-open]="isMobileOpen()">
  <div class="container navbar__inner">

    <button class="navbar__logo" (click)="scrollTo('home')" aria-label="Go to top">
      <span class="logo-mark">IV</span>
      <span class="logo-name">Ivan Vallejos</span>
    </button>

    <ul class="navbar__links" role="list">
      @for (link of navLinks; track link.id) {
        <li>
          <button class="nav-link" (click)="scrollTo(link.id)">
            {{ link.key | translate }}
          </button>
        </li>
      }
    </ul>

    <div class="navbar__controls">
      <button class="ctrl-btn lang-btn" (click)="toggleLang()"
        [title]="lang() === 'en' ? 'Cambiar a español' : 'Switch to English'">
        {{ lang() === 'en' ? 'ES' : 'EN' }}
      </button>

      <button class="ctrl-btn theme-btn" (click)="toggleTheme()"
        [title]="theme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'">
        @if (theme() === 'dark') {
          <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1"  x2="12" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22"  y1="4.22"  x2="5.64"  y2="5.64"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1"  y1="12" x2="3"  y2="12"/>
            <line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22"  y1="19.78" x2="5.64"  y2="18.36"/>
            <line x1="18.36" y1="5.64"  x2="19.78" y2="4.22"/>
          </svg>
        } @else {
          <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        }
      </button>

      <button class="ctrl-btn hamburger" (click)="toggleMobile()" aria-label="Toggle menu">
        @if (isMobileOpen()) {
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6"  y1="6" x2="18" y2="18"/>
          </svg>
        } @else {
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="3" y1="6"  x2="21" y2="6"/>
            <line x1="3" y1="12" x2="21" y2="12"/>
            <line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        }
      </button>
    </div>
  </div>

  @if (isMobileOpen()) {
    <div class="navbar__mobile" role="menu">
      @for (link of navLinks; track link.id) {
        <button class="mobile-link" (click)="scrollTo(link.id)" role="menuitem">
          {{ link.key | translate }}
        </button>
      }
    </div>
  }
</nav>
